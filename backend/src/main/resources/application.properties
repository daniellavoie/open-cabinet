spring.application.name=open-cabinet

spring.datasource.url=jdbc:postgresql://localhost:5432/opencabinet
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=start-only

spring.security.oauth2.resourceserver.jwt.issuer-uri=${open-cabinet.keycloak.issuer-uri}

management.endpoint.health.probes.enabled=true

# Design Assistant (ADR 0004). Without a key the assistant stays off; prices are US dollars per
# million tokens, taken from the provider's price list.
open-cabinet.assistant.anthropic.api-key=${ANTHROPIC_API_KEY:}
open-cabinet.assistant.anthropic.builder-model=claude-sonnet-5-5
open-cabinet.assistant.anthropic.sorter-model=claude-haiku-4-5-20251001
open-cabinet.assistant.anthropic.prices.[claude-sonnet-5-5].input-per-million=3
open-cabinet.assistant.anthropic.prices.[claude-sonnet-5-5].output-per-million=15
open-cabinet.assistant.anthropic.prices.[claude-opus-5-5].input-per-million=5
open-cabinet.assistant.anthropic.prices.[claude-opus-5-5].output-per-million=25
open-cabinet.assistant.anthropic.prices.[claude-haiku-4-5-20251001].input-per-million=1
open-cabinet.assistant.anthropic.prices.[claude-haiku-4-5-20251001].output-per-million=5

# Design Assistant attachments: 25 MB of photos, sketches and PDFs per message.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
