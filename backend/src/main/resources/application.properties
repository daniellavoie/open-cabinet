spring.application.name=open-cabinet

spring.datasource.url=jdbc:postgresql://localhost:5432/opencabinet
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=start-only

spring.security.oauth2.resourceserver.jwt.issuer-uri=${open-cabinet.keycloak.issuer-uri}

management.endpoint.health.probes.enabled=true
