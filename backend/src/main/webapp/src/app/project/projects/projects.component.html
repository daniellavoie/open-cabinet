<div class="page">
  <section class="list">
    <h1 i18n="@@projects.title">Projets</h1>
    <div *ngIf="!projects" i18n="@@common.loading">Chargement…</div>
    <p class="empty" *ngIf="projects?.length === 0" i18n="@@projects.empty">Aucun projet pour l'instant.</p>
    <table class="table table-hover" *ngIf="projects?.length">
      <thead>
        <tr>
          <th i18n="@@projects.name">Projet</th>
          <th i18n="@@projects.client">Client</th>
          <th i18n="@@projects.cabinets">Caissons</th>
          <th i18n="@@projects.updated">Modifié</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let project of projects" [routerLink]="['/projects', project.id]">
          <td>{{ project.name }}</td>
          <td>{{ clientNames.get(project.clientId) }}</td>
          <td>{{ project.design.cabinets.length }}</td>
          <td>{{ project.updateTimestamp | date: "mediumDate" }}</td>
        </tr>
      </tbody>
    </table>
  </section>

  <aside class="panel">
    <h2 i18n="@@projects.new">Nouveau projet</h2>
    <p class="hint" *ngIf="clients.length === 0" i18n="@@projects.needClient">Ajoutez d'abord un client.</p>
    <form (ngSubmit)="create()" *ngIf="clients.length > 0">
      <div class="mb-2">
        <label class="form-label" for="projectName" i18n="@@projects.name">Projet</label>
        <input class="form-control" id="projectName" name="name" [(ngModel)]="name" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="projectClient" i18n="@@projects.client">Client</label>
        <select class="form-select" id="projectClient" name="clientId" [(ngModel)]="clientId" required>
          <option *ngFor="let client of clients" [value]="client.id">{{ client.name }}</option>
        </select>
      </div>
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
      <button class="btn btn-primary" type="submit" [disabled]="creating || !name || !clientId" i18n="@@projects.create">Créer le projet</button>
    </form>
  </aside>
</div>
