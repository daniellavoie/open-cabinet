<fieldset class="panel" [disabled]="readOnly">
  <h2>
    <input class="form-control form-control-sm name" [(ngModel)]="name" (blur)="commitName()" (keydown.enter)="commitName()"
      i18n-aria-label="@@stackPanel.name" aria-label="Nom de la pile de façades" />
    <button class="btn btn-sm btn-link text-danger" (click)="remove.emit()" i18n="@@common.remove">Retirer</button>
  </h2>
  <div class="fields">
    <label for="stackMaterial" i18n="@@partPanel.material">Matériau</label>
    <select class="form-select form-select-sm" id="stackMaterial" [ngModel]="choiceValue(stack.material)" (ngModelChange)="setMaterial($event)">
      <option *ngFor="let choice of materialChoices.roles" [value]="choice.value">{{ choice.label }}</option>
      <option *ngFor="let choice of materialChoices.catalog" [value]="choice.value">{{ choice.label }}</option>
    </select>
  </div>

  <h3 i18n="@@stackPanel.rows">Rangées, du haut vers le bas</h3>
  <div class="row-edit" *ngFor="let row of rows; let index = index">
    <select class="form-select form-select-sm" [ngModel]="row.kind" (ngModelChange)="setRow(index, { kind: $event })"
      i18n-aria-label="@@stackPanel.kind" aria-label="Genre">
      <option *ngFor="let kind of kinds" [value]="kind">{{ kindLabels[kind] }}</option>
    </select>
    <select class="form-select form-select-sm" [ngModel]="row.heightMm != null" (ngModelChange)="setFixed(index, $event)"
      i18n-aria-label="@@stackPanel.sizing" aria-label="Hauteur">
      <option [ngValue]="true" i18n="@@stackPanel.fixed">Hauteur fixe</option>
      <option [ngValue]="false" i18n="@@stackPanel.share">Part du reste</option>
    </select>
    <length-input *ngIf="row.heightMm != null" [inputId]="'row-' + index" [units]="units" [valueMm]="row.heightMm"
      (valueMmChange)="setRow(index, { heightMm: $event })" />
    <input *ngIf="row.heightMm == null" class="form-control form-control-sm" type="number" min="1" [ngModel]="row.weight ?? 1"
      (ngModelChange)="setRow(index, { weight: $event })" i18n-aria-label="@@stackPanel.weight" aria-label="Part" />
    <div class="row-actions">
      <button class="btn btn-sm btn-link" (click)="moveRow(index, -1)" [disabled]="index === 0" i18n-aria-label="@@stackPanel.up" aria-label="Monter">↑</button>
      <button class="btn btn-sm btn-link" (click)="moveRow(index, 1)" [disabled]="index === rows.length - 1" i18n-aria-label="@@stackPanel.down" aria-label="Descendre">↓</button>
      <button class="btn btn-sm btn-link text-danger" (click)="removeRow(index)" i18n-aria-label="@@common.remove" aria-label="Retirer">×</button>
    </div>
  </div>
  <button class="btn btn-sm btn-outline-secondary" (click)="addRow()" i18n="@@stackPanel.addRow">Ajouter une rangée</button>
  <label class="form-check split">
    <input class="form-check-input" type="checkbox" [ngModel]="stack.splitAboveMm != null" (ngModelChange)="setSplit($event)" />
    <span i18n="@@stackPanel.split">Portes en deux battants au-delà de</span>
  </label>
  <length-input *ngIf="stack.splitAboveMm != null" inputId="stackSplit" [units]="units" [valueMm]="stack.splitAboveMm"
    (valueMmChange)="set({ splitAboveMm: $event })" />

  <h3 i18n="@@stackPanel.area">Zone des façades</h3>
  <attachment-editor *ngFor="let face of faces" [face]="face" [attachment]="stack.faces?.[face] ?? null" [targets]="targets"
    [units]="units" [thicknesses]="materialChoices" [optional]="false" [picking]="pendingFace === face" [readOnly]="readOnly"
    (attachmentChange)="setAttachment(face, $event)" (pick)="pick.emit(face)" />
</fieldset>
