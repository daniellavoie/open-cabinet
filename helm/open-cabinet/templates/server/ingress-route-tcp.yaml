apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "server.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
  - websecure
  routes:
  - match: {{ printf "HostSNI(`%s`)" ( required "Value domain is required" .Values.domain ) }}
    services:
    - name: {{ include "server.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 443
  tls:
    passthrough: true
