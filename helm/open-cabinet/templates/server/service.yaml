apiVersion: v1
kind: Service
metadata:
  name: {{ include "server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "open-cabinet.fullname" . }}
    release: {{ .Release.Name }}
    component: {{ include "server.fullname" . }}
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8443
  selector:
    app: {{ include "open-cabinet.fullname" . }}
    release: {{ .Release.Name }}
    component: {{ include "server.fullname" . }}
