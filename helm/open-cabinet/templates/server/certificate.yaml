apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "open-cabinet.fullname" . }}
    release: {{ .Release.Name }}
    component: {{ include "server.fullname" . }}
spec:
  secretName: {{ printf "%s-tls" ( include "server.fullname" . ) }}
  dnsNames:
  - {{ required "Value domain is required" .Values.domain }}
  issuerRef:
    name: {{ required "tls.clusterIssuer is required" .Values.tls.clusterIssuer }}
    kind: ClusterIssuer
