name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend and frontend
        run: ./mvnw -B verify -Pfrontend

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart with production values
        run: |
          helm lint helm/open-cabinet \
            -f .github/infra/open-cabinet-production/values.yaml \
            --set server.keycloak.issuerUri=https://keycloak.example/realms/open-cabinet
