name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

# Never run two deployments of production at once; let a running one finish.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  NAMESPACE: open-cabinet-production
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/open-cabinet-images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend and frontend
        run: ./mvnw -B install -Pfrontend

      - name: Publish Docker image tagged with the commit SHA
        run: |
          ./mvnw -B jib:build -pl backend -DskipTests \
            -Ddocker-registry.repository=$IMAGE_REPOSITORY \
            -Ddocker-registry.username=${{ github.actor }} \
            -Ddocker-registry.password=${{ secrets.GITHUB_TOKEN }} \
            -Ddocker-image.tag=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: open-cabinet-production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl create namespace $NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace $NAMESPACE \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Open Cabinet
        run: |
          helm upgrade --install open-cabinet helm/open-cabinet \
            --namespace $NAMESPACE --create-namespace \
            --force-conflicts \
            -f .github/infra/$NAMESPACE/values.yaml \
            --set image.repository=$IMAGE_REPOSITORY/opencabinet-backend \
            --set image.tag=${{ github.sha }}

      - name: Wait for Open Cabinet ready
        run: |
          kubectl rollout status deployment/open-cabinet-server -n $NAMESPACE --timeout=300s
